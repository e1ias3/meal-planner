function seedTickTickRecipes(){
  return TICKTICK_RECIPES.map(r => ({ id: uid(), name: r.name, instructions: r.instructions, sourceUrl: r.sourceUrl || '', category: r.category || 'Other', servings: 1, nutrition: { calories:null, protein:null, carbs:null, fat:null }, ingredients: [] }));
}
const UNITS = ['','pc','oz','lb','g','kg','cup','tbsp','tsp','ml','l','can','pkg','bunch'];

let state = null;
let activeTab = 'plan';
let applyingRemoteUpdate = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}

function defaultState(){
  const start = todayISO();
  const days = [];
  for(let i=0;i<14;i++){
    days.push({ date: addDays(start,i), recipeIds: [] });
  }
  return {
    categories: DEFAULT_CATEGORIES.slice(),
    recipeCategories: DEFAULT_RECIPE_CATEGORIES.slice(),
    recipes: seedTickTickRecipes(),
    plan: { startDate: start, days },
    grocery: { items: [], selectedDates: days.map(d=>d.date), updatedAt: null }
  };
}

function ensurePlanCoversTwoWeeks(){
  if(!state.plan || !Array.isArray(state.plan.days) || state.plan.days.length === 0){
    const start = todayISO();
    const days = [];
    for(let i=0;i<14;i++) days.push({ date: addDays(start,i), recipeIds: [] });
    state.plan = { startDate: start, days };
  }
  if(!state.grocery) state.grocery = { items: [], selectedDates: state.plan.days.map(d=>d.date), updatedAt: null };
  if(!state.categories) state.categories = DEFAULT_CATEGORIES.slice();
  if(!state.recipeCategories) state.recipeCategories = DEFAULT_RECIPE_CATEGORIES.slice();
  if(Array.isArray(state.recipes)){
    for(const r of state.recipes){
      if(r.sourceUrl == null) r.sourceUrl = '';
      if(!r.category) r.category = 'Other';
      if(r.servings == null) r.servings = 1;
      if(!r.nutrition) r.nutrition = newNutrition();
    }
  }
}

function updateStatus(text){
  const el = document.getElementById('status-line');
  if(el) el.textContent = text;
}

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 350);
}

async function persistNow(){
  updateStatus('Saving…');
  try{
    await setDoc(docRef, state);
    updateStatus('Synced');
  }catch(e){
    console.error('Save failed:', e);
    updateStatus('Save failed — will retry');
    setTimeout(scheduleSave, 2000);
  }
}

async function loadState(){
  try{
    const snap = await getDoc(docRef);
    if(snap.exists()){
      state = snap.data();
      ensurePlanCoversTwoWeeks();
      if(Array.isArray(state.recipes) && state.recipes.length === 0){
        state.recipes = seedTickTickRecipes();
        await persistNow();
      }
    } else {
      state = defaultState();
      await persistNow();
    }
  }catch(e){
    console.error('Load failed:', e);
    updateStatus('Could not connect — check Firebase config');
    state = defaultState();
  }
  render();

  // Real-time sync: any change written by another device updates this page automatically.
  onSnapshot(docRef, (snap) => {
    if(document.querySelector('.modal-bg')) return; // don't clobber an open edit
    if(!snap.exists()) return;
    const incoming = JSON.stringify(snap.data());
    const current = JSON.stringify(state);
    if(incoming !== current){
      state = snap.data();
      ensurePlanCoversTwoWeeks();
      render();
      updateStatus('Updated from another device');
    }
  }, (e) => {
    console.error('Sync listener error:', e);
  });
}

// ---------- tab handling ----------
document.querySelectorAll('.tab').forEach(btn=>{

});

function render(){
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.tab===activeTab));
  const view = document.getElementById('view');
  if(activeTab==='recipes') view.innerHTML = renderRecipesTab();
  else if(activeTab==='plan') view.innerHTML = renderPlanTab();
  else view.innerHTML = renderGroceryTab();
  attachTabListeners();
}

// =================== RECIPES ===================
function renderRecipesTab(){
  let html = '';
  if(state.recipes.length===0){
    html += `<div class="empty"><strong>No recipes yet</strong>Add the meals your household makes often.</div>`;
  } else {
    const byCat = {};
    for(const r of state.recipes){
      const cat = r.category || 'Other';
      (byCat[cat] = byCat[cat] || []).push(r);
    }
    const order = (state.recipeCategories||[]).filter(c=>byCat[c]);
    for(const cat of Object.keys(byCat)) if(!order.includes(cat)) order.push(cat);

    for(const cat of order){
      const items = byCat[cat].slice().sort((a,b)=> a.name.localeCompare(b.name));
      html += `<details class="cat-group" open>
        <summary class="section-head"><span class="dot"></span><h3>${esc(cat)}</h3><span class="count">${items.length}</span><span class="chev">›</span></summary>
        <div class="cat-body">`;
      for(const r of items){
        html += `<div class="card recipe-card" data-open-recipe="${r.id}">
          <div>
            <div class="name">${esc(r.name)}</div>
            <div class="meta">${r.ingredients.length} ingredient${r.ingredients.length===1?'':'s'}${r.sourceUrl ? ` · <a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener" data-stop-recipe-open>Source</a>` : ''}</div>
          </div>
          <div class="chev">›</div>
        </div>`;
      }
      html += `</div></details>`;
    }
  }
  html += `<button class="fab" id="add-recipe-btn">+ Add recipe</button>`;
  return html;
}

    el.addEventListener('click', ()=> openRecipePicker(el.dataset.addMeal));
  });
  document.querySelectorAll('[data-rm-meal]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [date, idx] = el.dataset.rmMeal.split('|');
      const day = state.plan.days.find(d=>d.date===date);
      day.recipeIds.splice(Number(idx),1);
      scheduleSave(); render();
    });
  });
  const genBtn = document.getElementById('gen-grocery-btn');
  if(genBtn) genBtn.addEventListener('click', generateGroceryList);
  const addStartBtn = document.getElementById('shift-start-btn');
  if(addStartBtn) addStartBtn.addEventListener('click', ()=> openShiftPlanModal());

  document.querySelectorAll('.grocery-check').forEach(el=>{
    el.addEventListener('change', ()=>{
      const item = state.grocery.items.find(i=>i.id===el.dataset.id);
      if(item){ item.checked = el.checked; scheduleSave(); render(); }
    });
  });
  document.querySelectorAll('.grocery-del').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.grocery.items = state.grocery.items.filter(i=>i.id!==el.dataset.id);
      scheduleSave(); render();
    });
  });
  const addItemBtn = document.getElementById('add-manual-item-btn');
  if(addItemBtn) addItemBtn.addEventListener('click', openAddItemModal);
  const clearCheckedBtn = document.getElementById('clear-checked-btn');
  if(clearCheckedBtn) clearCheckedBtn.addEventListener('click', ()=>{
    state.grocery.items = state.grocery.items.filter(i=>!i.checked);
    scheduleSave(); render();
  });
  const editDaysBtn = document.getElementById('edit-days-btn');
  if(editDaysBtn) editDaysBtn.addEventListener('click', openDayPickerModal);
}

    <textarea id="r-instructions" placeholder="Steps, notes, links…">${esc(draft.instructions||'')}</textarea>
    <div class="modal-actions">
      ${existing ? '<button class="btn ghost" id="del-recipe-btn" style="color:var(--danger)">Delete</button>' : ''}
      <button class="btn ghost" id="cancel-modal-btn">Cancel</button>
      <button class="btn primary" id="save-recipe-btn">Save</button>
    </div>
  </div></div>`;

  function newRowsRender(){
    const wrap = document.getElementById('ing-rows');
    wrap.innerHTML = draft.ingredients.map((ing, idx)=>`
      <div class="ing-row">
        <input type="text" placeholder="Ingredient" value="${esc(ing.name)}" data-ing="${idx}" data-field="name">
        <input type="number" placeholder="Qty" value="${ing.qty ?? ''}" data-ing="${idx}" data-field="qty" step="any" min="0">
        <select data-ing="${idx}" data-field="unit">${UNITS.map(u=>`<option value="${u}" ${u===ing.unit?'selected':''}>${u||'unit'}</option>`).join('')}</select>
        <select data-ing="${idx}" data-field="category">${state.categories.map(c=>`<option value="${c}" ${c===ing.category?'selected':''}>${c}</option>`).join('')}</select>
        <button class="del" data-ing-del="${idx}">✕</button>
      </div>`).join('');
    wrap.querySelectorAll('[data-ing]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const idx = Number(inp.dataset.ing), field = inp.dataset.field;
        draft.ingredients[idx][field] = field==='qty' ? inp.value : inp.value;
      });
    });
    wrap.querySelectorAll('[data-ing-del]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        draft.ingredients.splice(Number(btn.dataset.ingDel),1);
        if(draft.ingredients.length===0) draft.ingredients.push(newIngredient());
        newRowsRender();
      });
    });
  }
  newRowsRender();

  document.getElementById('add-ing-row').addEventListener('click', ()=>{
    draft.ingredients.push(newIngredient());
    newRowsRender();
  });
  document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);
  document.getElementById('r-name').addEventListener('input', e=> draft.name = e.target.value);
  document.getElementById('r-instructions').addEventListener('input', e=> draft.instructions = e.target.value);
  document.getElementById('r-source-url').addEventListener('input', e=> draft.sourceUrl = e.target.value);
  document.getElementById('r-category').addEventListener('change', e=> draft.category = e.target.value);
  document.getElementById('r-servings').addEventListener('input', e=> draft.servings = e.target.value);
  document.getElementById('r-nut-cal').addEventListener('input', e=> draft.nutrition.calories = e.target.value);
  document.getElementById('r-nut-protein').addEventListener('input', e=> draft.nutrition.protein = e.target.value);
  document.getElementById('r-nut-carbs').addEventListener('input', e=> draft.nutrition.carbs = e.target.value);
  document.getElementById('r-nut-fat').addEventListener('input', e=> draft.nutrition.fat = e.target.value);
  document.getElementById('r-new-cat-btn').addEventListener('click', ()=>{
    const name = prompt('New recipe category (e.g. Breakfast):');
    if(name && name.trim() && !state.recipeCategories.includes(name.trim())){
      state.recipeCategories.push(name.trim());
      scheduleSave();
      const sel = document.getElementById('r-category');
      const opt = document.createElement('option');
      opt.value = name.trim(); opt.textContent = name.trim();
      sel.appendChild(opt); sel.value = name.trim();
      draft.category = name.trim();
    }
  });

  const delBtn = document.getElementById('del-recipe-btn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    state.recipes = state.recipes.filter(r=>r.id!==existing.id);
    for(const day of state.plan.days) day.recipeIds = day.recipeIds.filter(rid=>rid!==existing.id);
    scheduleSave(); closeModal(); render();
  });

  document.getElementById('save-recipe-btn').addEventListener('click', ()=>{
    if(!draft.name.trim()){ alert('Give the recipe a name.'); return; }
    draft.sourceUrl = (draft.sourceUrl||'').trim();
    if(!draft.category) draft.category = 'Other';
    draft.servings = draft.servings==='' || draft.servings==null ? 1 : Math.max(1, Number(draft.servings));
    const toNum = v => (v===''||v==null) ? null : Number(v);
    draft.nutrition = {
      calories: toNum(draft.nutrition.calories),
      protein: toNum(draft.nutrition.protein),
      carbs: toNum(draft.nutrition.carbs),
      fat: toNum(draft.nutrition.fat)
    };
    draft.ingredients = draft.ingredients
      .filter(i=>i.name && i.name.trim())
      .map(i=>({ ...i, qty: i.qty===''||i.qty==null ? null : Number(i.qty) }));
    if(existing){
      const i = state.recipes.findIndex(r=>r.id===existing.id);
      state.recipes[i] = draft;
    } else {
      state.recipes.push(draft);
    }
    scheduleSave(); closeModal(); render();
  });
}

function newIngredient(){
  return { name:'', qty:'', unit:'', category: state.categories[0] };
}

function newNutrition(){
  return { calories: null, protein: null, carbs: null, fat: null };
}

function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

// =================== PLAN ===================
function renderPlanTab(){
  const days = state.plan.days;
  let html = `<div class="toolbar">
    <button class="btn small ghost" id="shift-start-btn">Shift plan dates</button>
  </div>`;
  for(const day of days){
    html += `<div class="day-block">
      <div class="day-head"><span class="dname">${fmtDate(day.date)}</span></div>`;
    const totals = { calories:0, protein:0, carbs:0, fat:0 };
    let anyData = false, anyMeal = false;
    for(let idx=0; idx<day.recipeIds.length; idx++){
      const r = state.recipes.find(rr=>rr.id===day.recipeIds[idx]);
      html += `<div class="meal-chip"><span>${r? esc(r.name) : '(deleted recipe)'}</span>
        <button class="rm" data-rm-meal="${day.date}|${idx}">✕</button></div>`;
      if(r){
        anyMeal = true;
        const n = r.nutrition || {};
        if(n.calories!=null){ totals.calories += n.calories; anyData = true; }
        if(n.protein!=null){ totals.protein += n.protein; anyData = true; }
        if(n.carbs!=null){ totals.carbs += n.carbs; anyData = true; }
        if(n.fat!=null){ totals.fat += n.fat; anyData = true; }
      }
    }
    if(anyMeal && anyData){
      const parts = [];
      if(totals.calories) parts.push(`${Math.round(totals.calories)} cal`);
      if(totals.protein) parts.push(`${Math.round(totals.protein)}g protein`);
      if(totals.carbs) parts.push(`${Math.round(totals.carbs)}g carbs`);
      if(totals.fat) parts.push(`${Math.round(totals.fat)}g fat`);
      html += `<div class="day-nutrition">${parts.join(' · ')}</div>`;
    }
    html += `<button class="add-meal-btn" data-add-meal="${day.date}">+ Add a meal</button>`;
    html += `</div>`;
  }
  return html;
}

function openShiftPlanModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal">
    <h2>Shift plan dates</h2>
    <label>New start date for Day 1</label>
    <input type="text" id="new-start" value="${state.plan.startDate}" placeholder="YYYY-MM-DD">

    </div>
  </div></div>`;
  document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);
  document.getElementById('apply-shift-btn').addEventListener('click', ()=>{
    const val = document.getElementById('new-start').value.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(val)){ alert('Use format YYYY-MM-DD'); return; }
    const oldRecipeIds = state.plan.days.map(d=>d.recipeIds);

    for(let i=0;i<14;i++){
      days.push({ date: addDays(val,i), recipeIds: oldRecipeIds[i] || [] });

    state.plan = { startDate: val, days };

  });
}

// =================== GROCERY ===================
function renderGroceryTab(){
  const items = state.grocery.items;
  let html = `<div class="toolbar">
    <button class="btn primary small" id="gen-grocery-btn">Update from meal plan</button>
    <button class="btn ghost small" id="edit-days-btn">Choose days</button>
  </div>`;

  if(items.length===0){
    html += `<div class="empty"><strong>No list yet</strong>Tap "Update from meal plan" to build your grocery list from the meals you've planned.</div>`;
  } else {
    const byCat = {};
    for(const it of items){
      const cat = it.category || 'Other';
      (byCat[cat] = byCat[cat] || []).push(it);
    }
    const order = state.categories.filter(c=>byCat[c]);
    for(const cat of Object.keys(byCat)) if(!order.includes(cat)) order.push(cat);

    for(const cat of order){
      const catItems = byCat[cat].sort((a,b)=> a.name.localeCompare(b.name));
      html += `<details class="cat-group" open>
        <summary class="section-head"><span class="dot"></span><h3>${esc(cat)}</h3><span class="count">${catItems.length}</span><span class="chev">›</span></summary>
        <div class="cat-body">`;
      for(const it of catItems){
        const qtyText = [it.qty, it.unit].filter(Boolean).join(' ');
        html += `<div class="item-row ${it.checked?'checked':''}">
          <input type="checkbox" class="grocery-check" data-id="${it.id}" ${it.checked?'checked':''}>
          <span class="itext">${esc(it.name)}</span>
          <span class="qty">${esc(qtyText)}</span>
          <button class="del grocery-del" data-id="${it.id}">✕</button>
        </div>`;
      }
      html += `</div></details>`;
    }
    html += `<div class="toolbar" style="margin-top:14px;">
      <button class="btn small ghost" id="clear-checked-btn">Clear checked</button>
    </div>`;
  }
  html += `<button class="fab" id="add-manual-item-btn">+ Add item</button>`;
  if(state.grocery.updatedAt){
    html += `<div class="status">List last updated ${new Date(state.grocery.updatedAt).toLocaleString()}</div>`;
  }
  return html;
}

function generateGroceryList(){
  const selected = new Set(state.grocery.selectedDates && state.grocery.selectedDates.length ? state.grocery.selectedDates : state.plan.days.map(d=>d.date));
  const relevantDays = state.plan.days.filter(d=>selected.has(d.date));

  const aggregated = new Map(); // key: name.toLowerCase()|unit -> item
  for(const day of relevantDays){
    for(const rid of day.recipeIds){
      const recipe = state.recipes.find(r=>r.id===rid);
      if(!recipe) continue;
      for(const ing of recipe.ingredients){
        const key = ing.name.trim().toLowerCase() + '|' + (ing.unit||'');
        if(aggregated.has(key)){
          const existing = aggregated.get(key);
          if(typeof existing.qty==='number' && typeof ing.qty==='number') existing.qty += ing.qty;
          else existing.qty = null; // can't combine cleanly, leave blank
        } else {
          aggregated.set(key, { id: uid(), name: ing.name.trim(), qty: ing.qty, unit: ing.unit, category: ing.category || 'Other', checked:false, manual:false });
        }
      }
    }
  }

  // preserve manual items and checked state from prior list
  const manualItems = state.grocery.items.filter(i=>i.manual===true);
  const prevCheckedKeys = new Map();
  for(const it of state.grocery.items){
    if(!it.manual) prevCheckedKeys.set(it.name.trim().toLowerCase()+'|'+(it.unit||''), it.checked);
  }
  const newAuto = Array.from(aggregated.values()).map(it=>{
    const key = it.name.trim().toLowerCase()+'|'+(it.unit||'');
    if(prevCheckedKeys.has(key)) it.checked = prevCheckedKeys.get(key);
    return it;
  });

  state.grocery.items = [...newAuto, ...manualItems];
  state.grocery.updatedAt = new Date().toISOString();
  scheduleSave();
  render();
}

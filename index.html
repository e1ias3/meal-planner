<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Meals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF7F1;
    --card:#FFFFFF;
    --ink:#2B2A26;
    --muted:#767065;
    --sage:#5B6E4E;
    --sage-dark:#465939;
    --line:#E4DDCF;
    --tag:#EFEAE0;
    --danger:#A5473C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Fraunces', serif; font-weight:600; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  .topbar{position:sticky; top:0; z-index:5; background:var(--cream); border-bottom:1px solid var(--line); padding:14px 16px 0;}
  .topbar h1{font-size:20px; margin-bottom:12px;}
  .tabs{display:flex; gap:20px;}
  .tab{background:none; border:none; padding:0 0 10px; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--ink); border-bottom-color:var(--sage); font-weight:500;}

  main{flex:1; padding:16px; padding-bottom:90px;}

  .empty{text-align:center; color:var(--muted); padding:48px 16px; font-size:14px;}
  .empty strong{display:block; color:var(--ink); font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin-bottom:6px;}

  .fab{position:fixed; left:50%; transform:translateX(-50%); bottom:20px; max-width:488px; width:calc(100% - 32px); background:var(--sage); color:#fff; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:500; cursor:pointer;}
  .fab:active{background:var(--sage-dark);}

  /* --- Cards & list items --- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;}
  .card h3{font-size:17px; margin-bottom:4px;}
  .card .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .card .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tag{background:var(--tag); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--muted); font-weight:500;}

  /* --- Recipe list --- */
  .recipe-card{display:flex; flex-direction:column; gap:2px;}
  .recipe-card .title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .recipe-card .title-row h3{flex:1; cursor:pointer;}
  .recipe-card .del-btn{background:none; border:none; color:var(--danger); font-size:18px; padding:0 4px; opacity:0.5;}
  .recipe-card .del-btn:active{opacity:1;}
  .recipe-card .ing-count{font-size:12px; color:var(--muted);}
  .recipe-card .actions{display:flex; gap:8px; margin-top:8px;}

  /* --- Search --- */
  .search-box{width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; margin-bottom:12px; background:var(--card); font-family:inherit;}
  .search-box:focus{outline:none; border-color:var(--sage);}

  /* --- Tag filter pills --- */
  .filter-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .pill{background:var(--tag); border:none; border-radius:999px; padding:5px 12px; font-size:12px; color:var(--muted); font-weight:500; cursor:pointer;}
  .pill.active{background:var(--sage); color:#fff;}

  /* --- Meal planner --- */
  .week-nav{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .week-nav button{background:none; border:none; font-size:20px; color:var(--sage); padding:8px 12px; border-radius:8px;}
  .week-nav .week-label{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .day-section{margin-bottom:20px;}
  .day-header{font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:8px; color:var(--ink);}
  .day-header .date-num{color:var(--muted); font-weight:400; font-size:13px;}
  .meal-slot{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:6px; min-height:44px;}
  .meal-slot .meal-icon{font-size:16px; flex-shrink:0;}
  .meal-slot .meal-type{font-size:12px; color:var(--muted); width:55px; flex-shrink:0;}
  .meal-slot .meal-content{flex:1; font-size:14px;}
  .meal-slot .meal-empty{color:var(--muted); font-style:italic;}
  .meal-slot .slot-clear{background:none; border:none; color:var(--danger); font-size:16px; opacity:0; padding:4px; transition:opacity 0.15s;}
  .meal-slot:hover .slot-clear{opacity:0.5;}
  .meal-slot .slot-clear:active{opacity:1;}
  .meal-slot.filled{background:#f0ede5;}

  /* --- Recipe selector dropdown --- */
  .meal-select{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--card); font-family:inherit;}
  .meal-free-input{width:100%; padding:6px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--card); font-family:inherit;}
  .meal-free-input:focus{outline:none; border-color:var(--sage);}

  /* --- Grocery list --- */
  .grocery-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .grocery-header .count{font-size:13px; color:var(--muted);}
  .grocery-actions{display:flex; gap:8px; margin-bottom:12px;}
  .grocery-actions button{font-size:12px; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--muted);}
  .grocery-actions button:active{background:var(--tag);}

  .aisle-group{margin-bottom:12px;}
  .aisle-header{display:flex; align-items:center; gap:8px; padding:8px 0; cursor:pointer; user-select:none;}
  .aisle-header .aisle-name{font-family:'Fraunces',serif; font-weight:600; font-size:14px;}
  .aisle-header .aisle-count{font-size:11px; color:var(--muted); background:var(--tag); border-radius:6px; padding:2px 7px;}
  .aisle-header .collapse-arrow{font-size:10px; color:var(--muted); transition:transform 0.2s;}
  .aisle-header.collapsed .collapse-arrow{transform:rotate(-90deg);}
  .aisle-items{overflow:hidden; transition:max-height 0.3s ease;}
  .aisle-group.collapsed .aisle-items{max-height:0;}

  .grocery-item{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:4px; min-height:44px;}
  .grocery-item .checkbox{width:22px; height:22px; border:2px solid var(--line); border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.15s;}
  .grocery-item .checkbox.checked{background:var(--sage); border-color:var(--sage);}
  .grocery-item .checkbox.checked::after{content:'✓'; color:#fff; font-size:13px; font-weight:bold;}
  .grocery-item .item-name{flex:1; font-size:14px;}
  .grocery-item .item-qty{font-size:12px; color:var(--muted); white-space:nowrap;}
  .grocery-item.checked .item-name{text-decoration:line-through; color:var(--muted);}
  .grocery-item .item-del{background:none; border:none; color:var(--danger); font-size:16px; opacity:0; padding:4px; transition:opacity 0.15s;}
  .grocery-item:hover .item-del{opacity:0.4;}
  .grocery-item .item-del:active{opacity:1;}
  .grocery-item .manual-badge{font-size:10px; color:var(--sage); background:var(--tag); border-radius:4px; padding:1px 5px; font-weight:600;}

  /* --- Modal --- */
  .modal-overlay{position:fixed; inset:0; background:rgba(43,42,38,0.4); z-index:10; display:flex; align-items:flex-end; justify-content:center;}
  .modal{background:var(--cream); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; padding:20px 16px 24px;}
  .modal-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin-bottom:16px;}
  .modal-close{position:absolute; top:16px; right:16px; background:none; border:none; font-size:22px; color:var(--muted);}
  .form-group{margin-bottom:14px;}
  .form-group label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:500;}
  .form-group input,.form-group select,.form-group textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; background:var(--card); font-family:inherit;
  }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none; border-color:var(--sage);}
  .form-group textarea{resize:vertical; min-height:80px;}

  .ingredient-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
  .ingredient-row input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--card); font-family:inherit;}
  .ingredient-row .ing-qty{width:60px; flex-shrink:0;}
  .ingredient-row .ing-unit{width:80px; flex-shrink:0;}
  .ingredient-row .ing-name{flex:1;}
  .ingredient-row .ing-del{background:none; border:none; color:var(--danger); font-size:16px; padding:4px; opacity:0.4;}
  .ingredient-row .ing-del:active{opacity:1;}
  .add-ing-btn{font-size:13px; color:var(--sage); background:none; border:1px dashed var(--line); border-radius:8px; padding:8px; width:100%; margin-top:4px;}

  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{flex:1; background:var(--sage); color:#fff; border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:500;}
  .btn-primary:active{background:var(--sage-dark);}
  .btn-secondary{flex:1; background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:15px;}

  /* --- Pantry exclusions --- */
  .pantry-item{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:4px;}
  .pantry-item .px-name{font-size:14px;}
  .pantry-item .px-del{background:none; border:none; color:var(--danger); font-size:16px; opacity:0.4;}
  .pantry-item .px-del:active{opacity:1;}

  /* --- Settings button --- */
  .settings-btn{position:fixed; top:14px; right:16px; background:none; border:none; font-size:20px; z-index:6; color:var(--muted);}

  /* --- Recipe detail view --- */
  .recipe-detail .back-btn{background:none; border:none; color:var(--sage); font-size:14px; margin-bottom:12px; padding:0;}
  .recipe-detail h2{font-size:20px; margin-bottom:6px;}
  .recipe-detail .detail-meta{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .recipe-detail h3{font-size:15px; margin-bottom:8px; margin-top:16px;}
  .recipe-detail .ing-list{list-style:none; padding:0; margin:0;}
  .recipe-detail .ing-list li{padding:6px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .recipe-detail .ing-list li:last-child{border-bottom:none;}
  .recipe-detail .ing-qty{color:var(--muted); font-weight:500; margin-right:8px;}

  /* --- Nutrition facts --- */
  .nutrition-section{margin-top:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .nutrition-section h3{margin-bottom:12px; font-size:16px;}
  .nutrition-loading{text-align:center; color:var(--muted); padding:20px; font-size:13px;}
  .nutrition-error{text-align:center; color:var(--danger); padding:12px; font-size:13px;}
  .nutrition-table{width:100%; border-collapse:collapse; font-size:13px;}
  .nutrition-table th{text-align:left; padding:8px 0; border-bottom:2px solid var(--ink); font-family:'Fraunces',serif; font-size:14px;}
  .nutrition-table td{padding:6px 0; border-bottom:1px solid var(--line);}
  .nutrition-table td.nutrient-name{font-weight:500;}
  .nutrition-table td.nutrient-value{text-align:right; color:var(--muted); white-space:nowrap;}
  .nutrition-table .per-serving-row td{border-bottom:2px solid var(--ink); padding-bottom:10px; font-family:'Fraunces',serif; font-size:15px; font-weight:600;}
  .nutrition-table .total-calories{font-size:18px; font-family:'Fraunces',serif; font-weight:600;}
  .nutrition-table .total-calories .cal-value{font-size:24px;}
  .nutrition-table .calories-row td{padding:10px 0; border-bottom:2px solid var(--ink);}
  .nutrition-source{font-size:11px; color:var(--muted); margin-top:10px; text-align:center;}
  .nutrition-refresh-btn{font-size:11px; color:var(--sage); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; margin-top:8px; cursor:pointer;}
  .nutrition-per-serving-toggle{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .nutrition-per-serving-toggle label{display:flex; align-items:center; gap:6px; cursor:pointer;}

  /* --- Category selector in add-item --- */
  .category-select{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:var(--card); font-family:inherit; margin-bottom:6px;}

  /* --- Toast --- */
  .toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); padding:10px 20px; border-radius:8px; font-size:13px; z-index:20; opacity:0; transition:opacity 0.3s; pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>

};

var DEFAULT_PANTRY = [
  'salt','black pepper','olive oil','vegetable oil','all-purpose flour',
  'white sugar','garlic','onion'
];

var DIETARY_TAGS = [
  'vegetarian','vegan','gluten-free','dairy-free','nut-free','low-carb',
  'keto','paleo','pescatarian','low-sodium'
];

var DAYS_TO_PLAN = 7;

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════

var state = {
  recipes: [],
  mealPlan: {}, // keyed by "YYYY-MM-DD:mealType"
  groceryItems: [],
  pantryExclusions: [],
  activeTab: 'meals',
  weekStart: null,
  collapsedAisles: {},
  modal: null,
  recipeDetail: null,
  searchQuery: '',
  activeTagFilter: null,
  showTotalNutrition: false
};

// ══════════════════════════════════════════════════════════════
// PERSISTENCE (localStorage)
// ══════════════════════════════════════════════════════════════

var STORAGE_KEY = 'household-meals-v1';

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var saved = JSON.parse(raw);
      state.recipes = saved.recipes || [];
      state.mealPlan = saved.mealPlan || {};
      state.groceryItems = saved.groceryItems || [];
      state.pantryExclusions = saved.pantryExclusions || DEFAULT_PANTRY.slice();
    } else {
      state.pantryExclusions = DEFAULT_PANTRY.slice();
    }
  } catch(e) {
    console.error('loadState error:', e);
    state.pantryExclusions = DEFAULT_PANTRY.slice();
  }
}

function saveState() {
  try {
    var toSave = {
      recipes: state.recipes,
      mealPlan: state.mealPlan,
      groceryItems: state.groceryItems,
      pantryExclusions: state.pantryExclusions
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) {
    console.error('saveState error:', e);
  }
}

// ══════════════════════════════════════════════════════════════
// UTILITIES

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function dateOffset(days) {
  var d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function getWeekStart() {
  if (state.weekStart) return state.weekStart;
  var d = new Date();
  var day = d.getDay(); // 0=Sun, 1=Mon, ...
  var mondayOffset = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + mondayOffset);
  state.weekStart = d.toISOString().slice(0, 10);
  return state.weekStart;
}

function addDays(dateStr, n) {
  var d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function formatDateLabel(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()] + ' ' + months[d.getMonth()] + ' ' + d.getDate();
}

function formatWeekRange(startStr) {
  var endStr = addDays(startStr, DAYS_TO_PLAN - 1);
  var s = new Date(startStr + 'T00:00:00');
  var e = new Date(endStr + 'T00:00:00');
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[s.getMonth()] + ' ' + s.getDate() + ' – ' + months[e.getMonth()] + ' ' + e.getDate();
}

function normalizeName(name) {
  return name.toLowerCase().trim().replace(/\s+/g, ' ');
}

function categorizeIngredient(name) {
  var lower = name.toLowerCase();
  for (var cat in CATEGORY_KEYWORDS) {
    var keywords = CATEGORY_KEYWORDS[cat];
    for (var i = 0; i < keywords.length; i++) {
      if (lower.indexOf(keywords[i]) !== -1) {
        return cat;
      }
    }
  }
  return 'other';
}

function isExcluded(name) {
  var norm = normalizeName(name);
  for (var i = 0; i < state.pantryExclusions.length; i++) {
    if (normalizeName(state.pantryExclusions[i]) === norm) return true;
    // Also check if the exclusion is a substring (e.g., "salt" matches "sea salt")
    if (norm.indexOf(normalizeName(state.pantryExclusions[i])) !== -1) return true;
  }
  return false;
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════════
// GROCERY LIST GENERATION ALGORITHM
// ══════════════════════════════════════════════════════════════

function generateGroceryList() {
  var rawList = [];

  // Step 1: COLLECT ingredients from planned meals
  for (var key in state.mealPlan) {
    var meal = state.mealPlan[key];
    if (meal.recipeId) {
      var recipe = findRecipe(meal.recipeId);
      if (recipe && recipe.ingredients) {
        var scale = (meal.servings && recipe.servings) ? meal.servings / recipe.servings : 1;
        for (var i = 0; i < recipe.ingredients.length; i++) {
          var ing = recipe.ingredients[i];
          rawList.push({
            name: ing.name,
            quantity: parseFloat(ing.quantity) * scale || 0,
            unit: ing.unit || '',
            category: ing.category || categorizeIngredient(ing.name),
            fromRecipes: [recipe.id]
          });
        }
      }
    }
  }

  // Step 2: DEDUPLICATE & SUM
  var deduped = {};
  for (var i = 0; i < rawList.length; i++) {
    var item = rawList[i];
    var normName = normalizeName(item.name);
    var dedupeKey = normName + '::' + item.unit;
    if (deduped[dedupeKey]) {
      deduped[dedupeKey].quantity += item.quantity;
      // merge fromRecipes
      item.fromRecipes.forEach(function(rid) {
        if (deduped[dedupeKey].fromRecipes.indexOf(rid) === -1) {
          deduped[dedupeKey].fromRecipes.push(rid);
        }
      });
    } else {
      deduped[dedupeKey] = {
        id: uid(),
        name: item.name,
        quantity: item.quantity,
        unit: item.unit,
        category: item.category,
        checked: false,
        source: 'auto',
        fromRecipes: item.fromRecipes
      };
    }
  }
  var dedupedList = Object.keys(deduped).map(function(k) { return deduped[k]; });

  // Handle same-name different-unit: keep separate but group visually by name
  // (already separate entries due to different dedupeKey)

  // Step 3: EXCLUDE pantry staples
  dedupedList = dedupedList.filter(function(item) {
    return !isExcluded(item.name);
  });

  // Step 4: AUTO-CATEGORIZE
  dedupedList.forEach(function(item) {
    if (!item.category || item.category === 'other') {
      item.category = categorizeIngredient(item.name);
    }
  });

  // Step 5: SORT by aisle
  dedupedList.sort(function(a, b) {
    var ai = AISLE_ORDER.indexOf(a.category);
    var bi = AISLE_ORDER.indexOf(b.category);
    if (ai === -1) ai = AISLE_ORDER.length;
    if (bi === -1) bi = AISLE_ORDER.length;
    if (ai !== bi) return ai - bi;
    return a.name.localeCompare(b.name);
  });

  // Step 6: MERGE manual additions
  var manualItems = state.groceryItems.filter(function(item) {
    return item.source === 'manual';
  });
  var allItems = dedupedList.concat(manualItems);

  // Re-sort all items (manual items should also be in aisle order)
  allItems.sort(function(a, b) {
    var ai = AISLE_ORDER.indexOf(a.category);
    var bi = AISLE_ORDER.indexOf(b.category);
    if (ai === -1) ai = AISLE_ORDER.length;
    if (bi === -1) bi = AISLE_ORDER.length;
    if (ai !== bi) return ai - bi;
    return a.name.localeCompare(b.name);
  });

  return allItems;
}

function findRecipe(id) {
  for (var i = 0; i < state.recipes.length; i++) {
    if (state.recipes[i].id === id) return state.recipes[i];
  }
  return null;
}

function getMealKey(date, mealType) {
  return date + ':' + mealType;
}

// RENDERING
// ══════════════════════════════════════════════════════════════

var app = document.getElementById('app');

function render() {
  if (state.recipeDetail) {
    renderRecipeDetail();
    return;
  }
  if (state.modal) {
    renderModal();
    return;
  }

  var html = '';
  html += '<div class="topbar">';
  html += '<h1>Household Meals</h1>';
  html += '<div class="tabs">';
  html += '<button class="tab ' + (state.activeTab === 'meals' ? 'active' : '') + '" onclick="setTab(\'meals\')">Meals</button>';
  html += '<button class="tab ' + (state.activeTab === 'recipes' ? 'active' : '') + '" onclick="setTab(\'recipes\')">Recipes</button>';
  html += '<button class="tab ' + (state.activeTab === 'groceries' ? 'active' : '') + '" onclick="setTab(\'groceries\')">Groceries</button>';
  html += '</div>';
  html += '</div>';
  html += '<button class="settings-btn" onclick="openPantry()">⚙️</button>';
  html += '<main>';

  if (state.activeTab === 'meals') {
    html += renderMealsTab();
  } else if (state.activeTab === 'recipes') {
    html += renderRecipesTab();
  } else if (state.activeTab === 'groceries') {
    html += renderGroceriesTab();
  }

  html += '</main>';

  // FAB
  if (state.activeTab === 'meals') {
    html += '<button class="fab" onclick="openAddMeal()">+ Add Meal</button>';
  } else if (state.activeTab === 'recipes') {
    html += '<button class="fab" onclick="openAddRecipe()">+ Add Recipe</button>';
  } else if (state.activeTab === 'groceries') {
    html += '<button class="fab" onclick="openAddItem()">+ Add Item</button>';
  }

  app.innerHTML = html;
}

// --- Meals Tab ---

function renderMealsTab() {
  var ws = getWeekStart();
  var html = '';

  html += '<div class="week-nav">';
  html += '<button onclick="shiftWeek(-7)">◄</button>';
  html += '<span class="week-label">' + formatWeekRange(ws) + '</span>';
  html += '<button onclick="shiftWeek(7)">►</button>';
  html += '</div>';

  for (var d = 0; d < DAYS_TO_PLAN; d++) {
    var date = addDays(ws, d);
    var isToday = date === todayISO();
    html += '<div class="day-section">';
    html += '<div class="day-header">' + formatDateLabel(date) + (isToday ? ' · Today' : '') + '</div>';

    for (var mi = 0; mi < MEAL_TYPES.length; mi++) {
      var mt = MEAL_TYPES[mi];
      var key = getMealKey(date, mt.id);
      var meal = state.mealPlan[key];
      html += '<div class="meal-slot' + (meal ? ' filled' : '') + '">';
      html += '<span class="meal-icon">' + mt.icon + '</span>';
      html += '<span class="meal-type">' + mt.label + '</span>';

      if (meal && meal.freeText) {
        html += '<span class="meal-content">' + esc(meal.freeText) + '</span>';
        html += '<button class="slot-clear" onclick="clearMeal(\'' + date + '\',\'' + mt.id + '\')">✕</button>';
      } else if (meal && meal.recipeId) {
        var recipe = findRecipe(meal.recipeId);
        html += '<span class="meal-content">' + (recipe ? esc(recipe.title) : '?') + '</span>';
        html += '<button class="slot-clear" onclick="clearMeal(\'' + date + '\',\'' + mt.id + '\')">✕</button>';
      } else {
        // Show dropdown
        html += renderMealSelector(date, mt.id);
      }
      html += '</div>';
    }
    html += '</div>';
  }

  return html;
}

function renderMealSelector(date, mealType) {
  var html = '<select class="meal-select" onchange="selectMeal(\'' + date + '\',\'' + mealType + '\', this.value)">';
  html += '<option value="">— add —</option>';
  html += '<option value="__freetext__">✏️ Free text...</option>';
  for (var i = 0; i < state.recipes.length; i++) {
    html += '<option value="' + state.recipes[i].id + '">' + esc(state.recipes[i].title) + '</option>';
  }
  html += '</select>';
  return html;
}

// --- Recipes Tab ---

function renderRecipesTab() {
  var html = '';
  html += '<input class="search-box" type="text" placeholder="🔍 Search recipes..." value="' + esc(state.searchQuery) + '" oninput="setSearch(this.value)">';

  // Tag filters
  html += '<div class="filter-pills">';
  html += '<button class="pill ' + (!state.activeTagFilter ? 'active' : '') + '" onclick="setTagFilter(null)">All</button>';
  for (var i = 0; i < DIETARY_TAGS.length; i++) {
    var tag = DIETARY_TAGS[i];
    html += '<button class="pill ' + (state.activeTagFilter === tag ? 'active' : '') + '" onclick="setTagFilter(\'' + tag + '\')">' + tag + '</button>';
  }
  html += '</div>';

  // Filter recipes
  var filtered = state.recipes.filter(function(r) {
    if (state.activeTagFilter && (!r.dietaryTags || r.dietaryTags.indexOf(state.activeTagFilter) === -1)) {
      return false;
    }
    if (state.searchQuery) {
      var q = state.searchQuery.toLowerCase();
      if (r.title.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    html += '<div class="empty"><strong>No recipes yet</strong>Add your first recipe to start meal planning.</div>';
  } else {
    for (var i = 0; i < filtered.length; i++) {
      var r = filtered[i];
      html += '<div class="card recipe-card">';
      html += '<div class="title-row">';
      html += '<h3 onclick="viewRecipe(\'' + r.id + '\')">' + esc(r.title) + '</h3>';
      html += '<button class="del-btn" onclick="deleteRecipe(\'' + r.id + '\')">✕</button>';
      html += '</div>';
      html += '<div class="meta">' + (r.servings || 4) + ' servings';
      if (r.prepTime || r.cookTime) {
        var totalTime = (r.prepTime || 0) + (r.cookTime || 0);
        html += ' · ' + totalTime + ' min';
      }
      html += ' · ' + (r.ingredients ? r.ingredients.length : 0) + ' ingredients</div>';
      if (r.dietaryTags && r.dietaryTags.length) {
        html += '<div class="tags">';
        for (var t = 0; t < r.dietaryTags.length; t++) {
          html += '<span class="tag">' + r.dietaryTags[t] + '</span>';
        }
        html += '</div>';
      }
      html += '<div class="actions">';
      html += '<button class="pill" onclick="editRecipe(\'' + r.id + '\')">✏️ Edit</button>';
      html += '</div>';
      html += '</div>';
    }
  }

  return html;
}

// --- Groceries Tab ---

function renderGroceriesTab() {
  var items = generateGroceryList();
  var checkedCount = items.filter(function(i) { return i.checked; }).length;

  var html = '';
  html += '<div class="grocery-header">';
  html += '<h2>🛒 Grocery List</h2>';
  html += '<span class="count">' + items.length + ' items · ' + checkedCount + ' checked</span>';
  html += '</div>';

  if (items.length === 0) {
    html += '<div class="empty"><strong>Your list is empty</strong>Plan some meals or add items manually.</div>';
    return html;
  }

  html += '<div class="grocery-actions">';
  html += '<button onclick="clearChecked()">✓ Clear Checked</button>';
  html += '<button onclick="resetList()">↻ Reset List</button>';
  html += '</div>';

  // Group by aisle
  var groups = {};
  for (var i = 0; i < items.length; i++) {
    var cat = items[i].category || 'other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(items[i]);
  }

  for (var ci = 0; ci < AISLE_ORDER.length; ci++) {
    var aisle = AISLE_ORDER[ci];
    if (!groups[aisle]) continue;
    var aisleItems = groups[aisle];
    var isCollapsed = state.collapsedAisles[aisle];
    var remainingCount = aisleItems.filter(function(i) { return !i.checked; }).length;

    html += '<div class="aisle-group' + (isCollapsed ? ' collapsed' : '') + '">';
    html += '<div class="aisle-header' + (isCollapsed ? ' collapsed' : '') + '" onclick="toggleAisle(\'' + aisle + '\')">';
    html += '<span class="collapse-arrow">▼</span>';
    html += '<span class="aisle-name">' + AISLE_LABELS[aisle] + '</span>';
    html += '<span class="aisle-count">' + remainingCount + '</span>';
    html += '</div>';
    html += '<div class="aisle-items" style="max-height:' + (isCollapsed ? '0' : (aisleItems.length * 60 + 20)) + 'px">';
    for (var ii = 0; ii < aisleItems.length; ii++) {
      var item = aisleItems[ii];
      html += '<div class="grocery-item' + (item.checked ? ' checked' : '') + '">';
      html += '<div class="checkbox' + (item.checked ? ' checked' : '') + '" onclick="toggleCheck(\'' + item.id + '\')"></div>';
      html += '<span class="item-name">' + esc(item.name) + '</span>';
      if (item.quantity && item.unit) {
        html += '<span class="item-qty">' + item.quantity + ' ' + item.unit + '</span>';
      } else if (item.quantity) {
        html += '<span class="item-qty">' + item.quantity + '</span>';
      }
      if (item.source === 'manual') {
        html += '<span class="manual-badge">manual</span>';
      }
      html += '<button class="item-del" onclick="removeItem(\'' + item.id + '\')">✕</button>';
      html += '</div>';
    }
    html += '</div>';
    html += '</div>';
  }

  return html;
}

// --- Recipe Detail ---

function renderRecipeDetail() {
  var r = findRecipe(state.recipeDetail);
  if (!r) { state.recipeDetail = null; render(); return; }

  var html = '';
  html += '<div class="topbar"><h1>Recipe</h1></div>';
  html += '<main class="recipe-detail">';
  html += '<button class="back-btn" onclick="closeRecipeDetail()">◄ Back</button>';
  html += '<h2>' + esc(r.title) + '</h2>';
  html += '<div class="detail-meta">' + (r.servings || 4) + ' servings';
  if (r.prepTime) html += ' · ' + r.prepTime + ' min prep';
  if (r.cookTime) html += ' · ' + r.cookTime + ' min cook';
  if (r.sourceUrl) html += ' · <a href="' + esc(r.sourceUrl) + '" target="_blank">Source ↗</a>';
  html += '</div>';

  if (r.dietaryTags && r.dietaryTags.length) {
    html += '<div class="tags">';
    for (var t = 0; t < r.dietaryTags.length; t++) {
      html += '<span class="tag">' + r.dietaryTags[t] + '</span>';
    }
    html += '</div>';
  }

  if (r.ingredients && r.ingredients.length) {
    html += '<h3>Ingredients</h3><ul class="ing-list">';
    for (var i = 0; i < r.ingredients.length; i++) {
      var ing = r.ingredients[i];
      html += '<li><span class="ing-qty">';
      if (ing.quantity) html += ing.quantity;
      if (ing.unit) html += ' ' + ing.unit;
      html += '</span>' + esc(ing.name) + '</li>';
    }
    html += '</ul>';
  }

  if (r.instructions) {
    html += '<h3>Instructions</h3>';
    html += '<div style="white-space:pre-wrap; font-size:14px; line-height:1.6;">' + esc(r.instructions) + '</div>';
  }

  // Nutrition section (loaded async after render)
  html += renderNutritionSection(r);

  html += '</main>';
  html += '<button class="fab" onclick="editRecipe(\'' + r.id + '\')">✏️ Edit Recipe</button>';

  app.innerHTML = html;

  // Trigger async nutrition load
  loadAndRenderNutrition(r);
}

// --- Modals ---

function renderModal() {
  if (state.modal === 'addRecipe' || state.modal === 'editRecipe') {
    renderRecipeModal();
  } else if (state.modal === 'pantry') {
    renderPantryModal();
  } else if (state.modal === 'addGroceryItem') {
    renderAddItemModal();
  } else if (state.modal === 'freeText') {
    renderFreeTextModal();
  }
}

function renderRecipeModal() {
  var editing = state.editingRecipeId;
  var r = editing ? findRecipe(editing) : null;

  var html = '';
  html += '<div class="modal-overlay" onclick="closeModal(event)">';
  html += '<div class="modal" onclick="event.stopPropagation()">';
  html += '<button class="modal-close" onclick="closeModal()">✕</button>';
  html += '<div class="modal-title">' + (editing ? 'Edit Recipe' : 'New Recipe') + '</div>';

  html += '<div class="form-group"><label>Title</label>';
  html += '<input id="r-title" value="' + (r ? esc(r.title) : '') + '" placeholder="Recipe name"></div>';

  html += '<div class="form-group"><label>Servings</label>';
  html += '<input id="r-servings" type="number" value="' + (r ? (r.servings || 4) : 4) + '" min="1"></div>';

  html += '<div class="form-group"><label>Source URL (optional)</label>';
  html += '<input id="r-source" value="' + (r ? esc(r.sourceUrl || '') : '') + '" placeholder="https://..."></div>';

  html += '<div class="form-group"><label>Prep time (min)</label>';
  html += '<input id="r-prep" type="number" value="' + (r ? (r.prepTime || '') : '') + '" placeholder="10"></div>';

  html += '<div class="form-group"><label>Cook time (min)</label>';
  html += '<input id="r-cook" type="number" value="' + (r ? (r.cookTime || '') : '') + '" placeholder="20"></div>';

  // Dietary tags
  html += '<div class="form-group"><label>Dietary Tags</label>';
  html += '<div class="filter-pills" id="tag-container">';
  var currentTags = r && r.dietaryTags ? r.dietaryTags : [];
  for (var i = 0; i < DIETARY_TAGS.length; i++) {
    var isActive = currentTags.indexOf(DIETARY_TAGS[i]) !== -1;
    html += '<button class="pill' + (isActive ? ' active' : '') + '" onclick="toggleRecipeTag(\'' + DIETARY_TAGS[i] + '\', this)">' + DIETARY_TAGS[i] + '</button>';
  }
  html += '</div></div>';

  // Ingredients
  html += '<div class="form-group"><label>Ingredients</label><div id="ing-container">';
  var ings = r && r.ingredients ? r.ingredients : [];
  for (var i = 0; i < Math.max(ings.length, 3); i++) {
    var ing = ings[i] || {};
    html += '<div class="ingredient-row">';
    html += '<input class="ing-qty" placeholder="Qty" value="' + (ing.quantity || '') + '" data-field="qty">';
    html += '<input class="ing-unit" placeholder="Unit" value="' + (ing.unit || '') + '" data-field="unit">';
    html += '<input class="ing-name" placeholder="Ingredient name" value="' + esc(ing.name || '') + '" data-field="name">';
    html += '<button class="ing-del" onclick="this.parentElement.remove()">✕</button>';
    html += '</div>';
  }
  html += '</div>';

  html += '</div>';

  // Instructions
  html += '<div class="form-group"><label>Instructions</label>';
  html += '<textarea id="r-instructions" placeholder="Step-by-step instructions...">' + (r ? esc(r.instructions || '') : '') + '</textarea></div>';

  html += '<div class="modal-actions">';
  html += '<button class="btn-secondary" onclick="closeModal()">Cancel</button>';
  html += '<button class="btn-primary" onclick="saveRecipe()">' + (editing ? 'Save Changes' : 'Add Recipe') + '</button>';
  html += '</div>';

  html += '</div></div>';
  app.innerHTML = html;
}

  html += '<div class="modal" onclick="event.stopPropagation()">';
  html += '<button class="modal-close" onclick="closeModal()">✕</button>';

  for (var i = 0; i < state.pantryExclusions.length; i++) {

    html += '<span class="px-name">' + esc(state.pantryExclusions[i]) + '</span>';

  }

  html += '<div class="form-group" style="margin-top:12px;">';

window.saveRecipe = function() {
  var title = document.getElementById('r-title').value.trim();
  if (!title) { showToast('Please enter a title'); return; }

  var servings = parseInt(document.getElementById('r-servings').value) || 4;
  var sourceUrl = document.getElementById('r-source').value.trim();
  var prepTime = parseInt(document.getElementById('r-prep').value) || null;
  var cookTime = parseInt(document.getElementById('r-cook').value) || null;
  var instructions = document.getElementById('r-instructions').value.trim();

  // Collect ingredients
  var ingRows = document.querySelectorAll('#ing-container .ingredient-row');
  var ingredients = [];
  for (var i = 0; i < ingRows.length; i++) {
    var name = ingRows[i].querySelector('.ing-name').value.trim();
    if (name) {
      var qty = parseFloat(ingRows[i].querySelector('.ing-qty').value) || 0;
      var unit = ingRows[i].querySelector('.ing-unit').value.trim();
      ingredients.push({
        name: name,
        quantity: qty,
        unit: unit,
        category: categorizeIngredient(name)
      });
    }
  }

  var recipeData = {
    id: state.editingRecipeId || uid(),
    title: title,
    servings: servings,
    sourceUrl: sourceUrl || null,
    prepTime: prepTime,
    cookTime: cookTime,
    instructions: instructions,
    ingredients: ingredients,
    dietaryTags: state.recipeTags || [],
    createdAt: state.editingRecipeId ? (findRecipe(state.editingRecipeId) ? findRecipe(state.editingRecipeId).createdAt : Date.now()) : Date.now(),
    updatedAt: Date.now()
  };

  if (state.editingRecipeId) {
    var idx = state.recipes.findIndex(function(r) { return r.id === state.editingRecipeId; });
    if (idx !== -1) state.recipes[idx] = recipeData;
  } else {
    state.recipes.push(recipeData);
  }

  state.modal = null;
  state.editingRecipeId = null;
  state.recipeTags = [];
  saveState();
  showToast(state.editingRecipeId ? 'Recipe updated' : 'Recipe added');

// ══════════════════════════════════════════════════════════════
// NUTRITION (USDA FoodData Central API)
// ══════════════════════════════════════════════════════════════

var USDA_API_KEY = 'DEMO_KEY';
var USDA_API_BASE = 'https://api.nal.usda.gov/fdc/v1';

// Nutrition cache: keyed by ingredient name (normalized)
// Each entry: { fdcId, description, nutrients: {name: {value, unit} }, gramsPer100: 100 }
var nutritionCache = {};
var nutritionLoading = false;
var nutritionError = null;

// Key nutrients to display (in order)
var KEY_NUTRIENTS = [
  { id: 'Energy',              name: 'Calories',        unit: 'kcal', showPerServing: true },
  { id: 'Protein',             name: 'Protein',          unit: 'g' },
  { id: 'Total lipid (fat)',   name: 'Total Fat',        unit: 'g' },
  { id: 'Carbohydrate, by difference', name: 'Total Carbohydrate', unit: 'g' },
  { id: 'Fiber, total dietary', name: 'Dietary Fiber',   unit: 'g' },
  { id: 'Total Sugars',        name: 'Sugars',            unit: 'g' },
  { id: 'Sodium, Na',          name: 'Sodium',           unit: 'mg' },
  { id: 'Cholesterol',         name: 'Cholesterol',      unit: 'mg' },
  { id: 'Calcium, Ca',         name: 'Calcium',           unit: 'mg' },
  { id: 'Iron, Fe',            name: 'Iron',              unit: 'mg' },
  { id: 'Potassium, K',        name: 'Potassium',         unit: 'mg' },
  { id: 'Vitamin C, total ascorbic acid', name: 'Vitamin C', unit: 'mg' },
  { id: 'Vitamin A, RAE',      name: 'Vitamin A',        unit: 'mcg' }
];

// Unit-to-grams conversion (approximate weights for common cooking units)
// These are used to estimate the gram weight of an ingredient portion
var UNIT_GRAMS = {
  // Weight units
  'g': 1, 'gram': 1, 'grams': 1, 'gr': 1,
  'kg': 1000, 'kilogram': 1000, 'kilograms': 1000,
  'oz': 28.35, 'ounce': 28.35, 'ounces': 28.35,
  'lb': 453.6, 'lbs': 453.6, 'pound': 453.6, 'pounds': 453.6,
  // Volume units (approximate, assumes water-like density for most foods)
  'tsp': 5, 'teaspoon': 5, 'teaspoons': 5,
  'tbsp': 15, 'tablespoon': 15, 'tablespoons': 15,
  'cup': 240, 'cups': 240,
  'ml': 1, 'milliliter': 1, 'milliliters': 1, 'cc': 1,
  'l': 1000, 'liter': 1000, 'liters': 1000, 'litre': 1000, 'litres': 1000,
  'pint': 473, 'pints': 473,
  'quart': 946, 'quarts': 946, 'qt': 946,
  'fl oz': 30, 'fluid ounce': 30, 'fluid ounces': 30,
  // Common food-specific units (approximate)
  'clove': 5, 'cloves': 5,
  'head': 500, 'heads': 500,        // for lettuce, broccoli, cabbage
  'piece': 30, 'pieces': 30,         // generic piece
  'slice': 30, 'slices': 30,        // bread slice
  'stick': 113, 'sticks': 113,       // butter stick (1/2 cup)
  'can': 400, 'cans': 400,           // 15 oz can
  'pinch': 0.3, 'dash': 0.6,
  'small': 100, 'medium': 150, 'large': 200,
  'whole': 200,
};

// Specific gram weights for common items (overrides the generic unit conversion)
var INGREDIENT_GRAMS = {
  'egg': 50, 'eggs': 50,
  'garlic clove': 5, 'garlic': 5,
  'onion': 150, 'onions': 150,
  'banana': 118, 'bananas': 118,
  'apple': 182, 'apples': 182,
  'tomato': 123, 'tomatoes': 123,
  'potato': 173, 'potatoes': 173,
  'carrot': 61, 'carrots': 61,
  'lemon': 58, 'lemons': 58,
  'lime': 67, 'limes': 67,
  'broccoli head': 500, 'broccoli': 150,
  'bell pepper': 120, 'bell peppers': 120,
  'cucumber': 200, 'cucumbers': 200,
  'chicken breast': 170, 'chicken breast raw': 170,
  'salmon fillet': 170, 'salmon': 170,
};

function estimateGrams(quantity, unit, name) {
  if (!quantity) return 0;
  var normName = normalizeName(name);

  // Check specific ingredient overrides first
  for (var ing in INGREDIENT_GRAMS) {
    if (normName === normalizeName(ing) || normName.indexOf(normalizeName(ing)) !== -1) {
      // If unit is empty or "whole" or "piece", use per-item weight
      if (!unit || unit === 'whole' || unit === 'piece' || unit === 'pieces') {
        return quantity * INGREDIENT_GRAMS[ing];
      }
    }
  }

  // Check unit conversion
  if (unit) {
    var normUnit = unit.toLowerCase().trim();
    if (UNIT_GRAMS[normUnit]) {
      return quantity * UNIT_GRAMS[normUnit];
    }
    // Try singular/plural
    if (normUnit.endsWith('s')) {
      var singular = normUnit.slice(0, -1);
      if (UNIT_GRAMS[singular]) return quantity * UNIT_GRAMS[singular];
    }
  }

  // Fallback: if no unit, assume 100g per unit (reasonable for "1 onion", "2 tomatoes")
  if (!unit) return quantity * 100;

  return quantity * 100; // default fallback
}

function fetchNutritionForIngredient(ingName) {
  var normName = normalizeName(ingName);

  // Check in-memory cache
  if (nutritionCache[normName] !== undefined) {
    return Promise.resolve(nutritionCache[normName]);
  }

  // Check localStorage cache
  var storageKey = 'nutrition-cache-' + normName;
  try {
    var cached = localStorage.getItem(storageKey);
    if (cached) {
      var entry = JSON.parse(cached);
      nutritionCache[normName] = entry;
      return Promise.resolve(entry);
    }
  } catch(e) { /* ignore */ }

  // Single API call: search SR Legacy first, which has per-100g data
  // If no results, the broad search (no dataType filter) is the fallback in the SAME response
  var apiKey = USDA_API_KEY;
  // Allow user to override the key via localStorage
  try {
    var customKey = localStorage.getItem('usda-api-key');
    if (customKey) apiKey = customKey;
  } catch(e) { /* ignore */ }

  var url = USDA_API_BASE + '/foods/search?api_key=' + apiKey +
    '&query=' + encodeURIComponent(ingName) + '&pageSize=1';

  return fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('API error: ' + r.status);
      return r.json();
    })
    .then(function(data) {
      var foods = data.foods || [];
      if (foods.length === 0) {
        nutritionCache[normName] = null;
        return null;
      }

      var food = foods[0];
      var nutrients = {};

      // Values are per 100g for SR Legacy and FNDDS; for Branded foods,
      // nutrients are per serving — but we use per-100g by default.
      // The API returns per-100g for SR Legacy and Survey (FNDDS) types.
      for (var i = 0; i < (food.foodNutrients || []).length; i++) {
        var n = food.foodNutrients[i];
        if (n.nutrientName && n.value != null) {
          nutrients[n.nutrientName] = {
            value: n.value,
            unit: n.unitName
          };
        }
      }

      var entry = {
        fdcId: food.fdcId,
        description: food.description,
        dataType: food.dataType,
        nutrients: nutrients, // per 100g
        gramWeight: 100
      };

      // Cache in memory and localStorage
      nutritionCache[normName] = entry;
      try {
        localStorage.setItem(storageKey, JSON.stringify(entry));
      } catch(e) { /* localStorage full or unavailable */ }

      return entry;
    })
    .catch(function(err) {
      console.error('Nutrition fetch error for "' + ingName + '":', err);
      nutritionCache[normName] = null;
      return null;
    });
}

function calculateRecipeNutrition(recipe) {
  if (!recipe || !recipe.ingredients || recipe.ingredients.length === 0) {
    return Promise.resolve(null);
  }

  var servings = recipe.servings || 4;
  var promises = [];

  for (var i = 0; i < recipe.ingredients.length; i++) {
    var ing = recipe.ingredients[i];
    promises.push(fetchNutritionForIngredient(ing.name).then(function(entry) {
      return { ingredient: ing, entry: entry };
    }));
  }

  return Promise.all(promises).then(function(results) {
    // Sum up nutrients per 100g for each ingredient, scaled by estimated grams
    var totals = {}; // nutrient name -> { value, unit }
    var ingredientDetails = [];

    for (var i = 0; i < results.length; i++) {
      var r = results[i];
      var ing = r.ingredient;
      var entry = r.entry;

      if (!entry) {
        ingredientDetails.push({
          name: ing.name,
          matched: false,
          grams: 0
        });
        continue;
      }

      var grams = estimateGrams(ing.quantity, ing.unit, ing.name);
      var scale = grams / 100; // scale from per-100g to actual grams

      ingredientDetails.push({
        name: ing.name,
        matched: true,
        usdaName: entry.description,
        fdcId: entry.fdcId,
        grams: Math.round(grams)
      });

      for (var nutName in entry.nutrients) {
        var nut = entry.nutrients[nutName];
        if (!totals[nutName]) {
          totals[nutName] = { value: 0, unit: nut.unit };
        }
        totals[nutName].value += nut.value * scale;
      }
    }

    // Calculate per-serving by dividing by servings
    var perServing = {};
    for (var nutName in totals) {
      perServing[nutName] = {
        value: totals[nutName].value / servings,
        unit: totals[nutName].unit
      };
    }

    return {
      perServing: perServing,
      total: totals,
      ingredientDetails: ingredientDetails,
      servings: servings
    };
  });
}

function renderNutritionSection(recipe) {
  // Show loading state first
  var html = '<div class="nutrition-section" id="nutrition-section">';
  html += '<h3>📊 Nutrition Facts</h3>';
  html += '<div class="nutrition-loading" id="nutrition-loading">Looking up ingredients on USDA FoodData Central…</div>';
  html += '</div>';
  return html;
}

function loadAndRenderNutrition(recipe) {
  nutritionLoading = true;
  nutritionError = null;

  calculateRecipeNutrition(recipe).then(function(result) {
    nutritionLoading = false;

    if (!result) {
      var el = document.getElementById('nutrition-loading');
      if (el) el.textContent = 'No ingredients to analyze.';
      return;
    }

    var section = document.getElementById('nutrition-section');
    if (!section) return;

    var html = '<h3>📊 Nutrition Facts</h3>';
    html += '<div class="nutrition-per-serving-toggle">';
    html += '<label><input type="checkbox" id="per-serving-toggle" checked onchange="togglePerServing()"> Per serving (' + result.servings + ' servings)</label>';
    html += '</div>';

    // Get key nutrients
    var nutrients = state.showTotalNutrition ? result.total : result.perServing;

    // Find calories
    var calNut = nutrients['Energy'] || nutrients['Energy, kcal'];
    var calories = calNut ? Math.round(calNut.value) : null;

    // Build table
    html += '<table class="nutrition-table">';
    html += '<tr class="calories-row total-calories"><td>Calories</td><td class="cal-value">' + (calories !== null ? calories : '—') + '</td></tr>';

    for (var i = 0; i < KEY_NUTRIENTS.length; i++) {
      var kn = KEY_NUTRIENTS[i];
      if (kn.id === 'Energy') continue; // already shown above

      var nut = nutrients[kn.id];
      if (!nut) continue;

      var val = nut.value;
      var unit = nut.unit || kn.unit;

      // Round appropriately
      if (unit === 'g' || unit === 'G') {
        val = Math.round(val * 10) / 10;
        if (val === 0) continue;
      } else if (unit === 'mg' || unit === 'MG') {
        val = Math.round(val);
        if (val === 0) continue;
      } else if (unit === 'mcg' || unit === 'UG') {
        val = Math.round(val);
        if (val === 0) continue;
      } else {
        val = Math.round(val * 10) / 10;
      }

      html += '<tr><td class="nutrient-name">' + kn.name + '</td><td class="nutrient-value">' + val + ' ' + unit + '</td></tr>';
    }

    html += '</table>';

    // Show ingredient match details
    if (result.ingredientDetails && result.ingredientDetails.length) {
      var matchedCount = result.ingredientDetails.filter(function(d) { return d.matched; }).length;
      var unmatchedCount = result.ingredientDetails.length - matchedCount;
      html += '<div class="nutrition-source">';
      html += '📊 ' + matchedCount + ' of ' + result.ingredientDetails.length + ' ingredients matched to USDA FoodData Central';
      if (unmatchedCount > 0) {
        html += '<br>Not found: ' + result.ingredientDetails.filter(function(d) { return !d.matched; }).map(function(d) { return d.name; }).join(', ');
      }
      html += '<br>Values are estimates based on standard unit-to-gram conversions.';
      html += '</div>';
    }

    html += '<button class="nutrition-refresh-btn" onclick="refreshNutrition(\'' + recipe.id + '\')">↻ Refresh</button>';
    html += '</div>';

    section.innerHTML = html;
  }).catch(function(err) {
    nutritionLoading = false;
    nutritionError = err.message;
    var section = document.getElementById('nutrition-section');
    if (section) {
      section.innerHTML = '<h3>📊 Nutrition Facts</h3><div class="nutrition-error">Could not load nutrition data: ' + esc(err.message) + '</div>';
    }
  });
}

window.togglePerServing = function() {
  state.showTotalNutrition = !state.showTotalNutrition;
  var checkbox = document.getElementById('per-serving-toggle');
  if (checkbox) state.showTotalNutrition = !checkbox.checked;
  // Re-render the nutrition section
  if (state.recipeDetail) {
    var recipe = findRecipe(state.recipeDetail);
    if (recipe) loadAndRenderNutrition(recipe);
  }
};

window.saveUsdaKey = function() {
  var key = document.getElementById('usda-key-input').value.trim();
  try {
    if (key) {
      localStorage.setItem('usda-api-key', key);
    } else {
      localStorage.removeItem('usda-api-key');
    }
  } catch(e) {}
  showToast(key ? 'API key saved' : 'API key cleared (using DEMO_KEY)');
};

window.refreshNutrition = function(recipeId) {
  // Clear cache for this recipe's ingredients (both in-memory and localStorage)
  var recipe = findRecipe(recipeId);
  if (recipe && recipe.ingredients) {
    for (var i = 0; i < recipe.ingredients.length; i++) {
      var normName = normalizeName(recipe.ingredients[i].name);
      delete nutritionCache[normName];
      try { localStorage.removeItem('nutrition-cache-' + normName); } catch(e) {}
    }
  }
  if (recipe) loadAndRenderNutrition(recipe);
};

})(); // IIFE
</script>
